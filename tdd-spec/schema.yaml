name: tdd-spec
version: 1
description: 团队规范 - (可选 grill) → proposal → specs → design(含架构) → interface → tasks(TDD 切片) → apply(red-green-refactor)
artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更提案：为什么做、做什么、影响哪些能力
    template: proposal.md
    instruction: |
      编写 proposal，说明本次变更「为什么做」和「做什么」。

      **第 0 步（可选）：需求澄清**
      动笔前先判断需求是否足够清晰。出现以下任一情况，先停下，建议用户运行
      `/grill-with-docs` 细化需求（它会同时产出/更新 CONTEXT.md 术语表和 ADR），
      澄清后再写 proposal：
      - 目标、范围或验收标准含糊，存在多种合理解读
      - 涉及新的领域概念，术语尚未统一
      - 存在会改变 specs 或方案的未决决策
      需求已经清晰时跳过此步。无论是否执行，都在「需求澄清」一节如实记录。
      若项目存在 CONTEXT.md / docs/adr，写作时沿用其中的术语与决策。

      各节要求：
      - **需求澄清**：是否执行 grill；执行了则链接产出的 CONTEXT.md / ADR 并列出关键结论。
      - **Why（背景与问题）**：1-3 句说明问题或机会，以及为什么是现在。
      - **目标 / 非目标**：可验证的目标；明确不做的事。
      - **What Changes（变更内容）**：逐条列出变化，破坏性变化标注 **BREAKING**。
      - **Capabilities**：
        - 新增能力：每项对应 `specs/<capability-path>/spec.md`，路径段使用 kebab-case。
        - 修改能力：只列需求层面行为变化的能力，使用 `openspec/specs/` 下的准确现有路径。
      - **接口影响**：是否新增/修改/移除对外或跨模块接口（决定 interface.md 的内容）。
      - **影响范围**：受影响的代码、模块、依赖、系统。

      注意：`## Why` 与 `## What Changes` 两个标题必须保持英文字面量（OpenSpec 解析器
      依赖它们），正文用中文书写。

      写 Capabilities 前先调研现有 specs：`openspec list --specs`，再对相关项
      `openspec show "<spec-id>" --type spec`。复用已有能力路径，不要造近义重复名。

      没有任何需求层面行为变化（纯重构/工具/文档）时，在 `.openspec.yaml` 设置
      `skip_specs: true`，不要为通过校验编造需求。

      保持简洁（1-2 页），聚焦 why/what；how 放到 design.md。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Delta 规格：系统应当表现出的可观察行为
    template: spec.md
    instruction: |
      为 proposal 中列出的每个能力编写 delta spec，定义系统「应该做什么」。

      spec 是行为契约，不是实现计划：
      - 写：可观察行为、输入输出、错误条件、外部约束、可测试的场景
      - 不写：内部类名/函数名、库选型、实现步骤

      **TDD 约束：每个 Scenario 都将成为至少一个测试用例。**
      场景必须具体到能直接翻译成测试：给出确定的前置条件、输入和可断言的结果，
      期望值来自业务事实而非实现计算。无法测试的场景要改写，或说明其验证方式。

      Delta 操作（## 标题）：
      - **ADDED Requirements**：新增
      - **MODIFIED Requirements**：修改——必须贴出完整的更新后需求块
      - **REMOVED Requirements**：移除——必须写 **Reason** 与 **Migration**
      - **RENAMED Requirements**：仅改名，使用 FROM:/TO:

      格式（解析器依赖，必须遵守）：
      - 需求：`### Requirement: <name>`，正文使用 SHALL/MUST
      - 场景：`#### Scenario: <name>`，**必须恰好 4 个 #**，使用 WHEN/THEN（可加 GIVEN/AND）
      - 每个需求至少一个场景
      - 仅新增能力需要 `## Purpose`（50 字符以上）；修改已有能力不要加

      MODIFIED 流程：从 `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      复制整个需求块（含全部场景），粘贴到 MODIFIED 下再修改，标题保持一致。
      只是新增关注点而不改变既有行为时，用 ADDED。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计：架构、关键决策、流程、测试接缝
    template: design.md
    instruction: |
      编写 design，说明「怎么做」。本规范下 design.md 必须创建，且必须包含「架构」章节。

      各节要求：
      - **设计上下文**：只写解释方案所需的现状与约束；动机引用 proposal，不复述。
      - **架构**（章节必填）：
        - 若本次变更不改变模块结构、职责边界或依赖关系（如小型重构、纯文档），
          写「架构无变化」并说明原因，下列三项可省略。
        - 总体结构：用 mermaid 画出本次变化涉及的模块/组件、它们之间的调用与数据流、
          以及外部依赖。只画与本次变更相关的部分，并标出新增/修改/不变。
        - 模块职责与边界：每个受影响模块的职责、对外暴露什么、隐藏什么。
          优先设计「深模块」：接口小、隐藏复杂度大。
        - 依赖与分层：依赖方向；有反向/跨层依赖时说明原因。回调、事件、异步结果
          属于原接口的双向消息，不画成反向依赖。
      - **关键决策**：表格列出 决策 / 选择 / 原因 / 放弃的方案及代价。
      - **关键流程**：正常、失败、恢复、并发时跨边界发生了什么（可用时序图）。
      - **状态、错误与资源**：跨边界的状态、错误、超时、并发、资源生命周期及归属。
      - **安全、兼容与迁移**：权限、版本兼容、数据迁移、回滚。
      - **测试策略与接缝（Seams）**：列出将在哪些公共边界编写测试、各自覆盖哪些 spec 场景、
        需要 mock 的外部依赖（只 mock 系统边界，不 mock 内部协作者）。
        这些接缝是 apply 阶段 TDD 的约定边界，需要与用户确认。
      - **风险 / 权衡**：[风险] → 缓解措施 → 验证方式。
      - **待定问题**：只留不影响 specs、方案和任务拆分的问题；会影响的必须现在问清楚。

      接口契约细节写在 interface.md，这里只放索引与架构位置，不重复契约正文。
      沿用 CONTEXT.md 术语，遵守已有 ADR；新增重大决策可建议补 ADR。
    requires:
      - proposal
      - specs

  - id: interface
    generates: interface.md
    description: 接口契约：本次新增/修改/移除的接口的完整约定
    template: interface.md
    instruction: |
      编写 interface.md，描述本次变更涉及的接口契约。接口包括：对外 API（HTTP/RPC/SDK）、
      跨模块/跨进程的调用接口、事件/消息、回调、CLI、配置格式、持久化数据格式等
      被其他方依赖的边界。

      规则：
      - 先填「接口变化索引」，只保留实际行。若本次无任何接口变化，索引写一行
        「无接口变化」并简述理由，其余章节删除。
      - 契约只由唯一提供方描述；使用方只写使用假设，不复制契约正文。
      - 每个接口一个二级章节，按模板逐节填写。不适用的小节写「不适用」而不是删除，
        以示已考虑。
      - 描述行为语义（前置条件、后置条件、错误、时序），不要粘贴大段实现代码。
      - **签名**：新增或修改的接口必须在「拟定签名」中写出最小可审查的签名
        （如方法名+参数/返回类型、HTTP 方法+路径、事件主题+载荷类型、配置键+类型），
        以便在实现前评审；实现完成后在「实现映射」中补充源码/IDL 链接，以源码为准。
      - 回调、事件、异步结果属于本接口的双向消息，写在本接口内。
      - **契约测试**：每个接口列出验证该契约的测试（对应 design 中的测试接缝和
        spec 场景）。这些测试在 apply 阶段按 TDD 先写。
      - 与 specs 保持一致：接口行为若在 spec 场景中有体现，引用该场景名。
    requires:
      - design

  - id: tasks
    generates: tasks.md
    description: 以 TDD 垂直切片组织的实现任务清单
    template: tasks.md
    instruction: |
      编写任务清单。先检查 design.md 的待定问题，会影响实现的必须先与用户确认。

      **遵守模板格式**：apply 阶段按复选框解析进度；只有 `- [x]` 算完成。

      **TDD 拆分规则（必须遵守）：**
      - 按「垂直切片」拆分：一个任务 = 一个可观察行为 = 一轮 red → green → refactor。
        禁止「先写全部测试、再写全部实现」的水平拆分，也禁止单独的「最后补测试」分组。
      - 每个行为任务写明：对应的 spec 场景、测试所在的接缝（来自 design 测试策略 /
        interface 契约测试）、完成判据（该测试从红变绿且全量测试通过）。
        格式：`- [ ] X.Y <行为描述> — 场景: <Scenario 名> — 接缝: <seam> — 验证: <测试名/命令>`
      - 第一个切片应是贯穿主路径的「曳光弹」（最简单的端到端行为），后续切片逐步扩展，
        边界与错误场景各自成为独立切片。
      - 只有「新增或改变」的行为才走 red → green → refactor。以下情况不要制造失败测试，
        改写为验证任务（`- [ ] X.Y [验证] ... — 验证: <测试/命令>`）：
        - MODIFIED 需求中原样保留、行为未变的场景：映射到现有回归测试，确认仍通过
        - REMOVED 需求：删除/调整对应测试与代码，验证全量测试通过、旧行为已不可达
        - RENAMED 需求：仅同步测试命名，验证测试通过
        - `skip_specs: true` 的变更（纯重构/工具/文档）：以现有测试全绿 + 具体验证命令为判据
      - 每个 spec 场景都必须被至少一个任务覆盖（行为任务或验证任务）；在末尾「覆盖检查」中列出映射。
      - 脚手架/依赖准备可作为第 0 组，不需要测试；文档更新跟随其所属切片，不集中到最后。
      - 最后一组只放跨切片的集成验证与重构收尾。
    requires:
      - specs
      - design
      - interface

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    按 TDD 实现。开始前加载 `tdd` skill，严格遵守其中的测试原则与循环规则。

    开始前：
    1. 阅读 proposal、specs、design（重点：架构、测试策略与接缝）、interface、CONTEXT.md/ADR。
    2. 与用户确认本次的测试接缝（design 中已列出的则复述并确认一次即可，之后不逐条确认）。
    3. 运行现有测试，确认基线为绿；不是绿先报告。

    对 tasks.md 中每个行为任务，按顺序执行一轮（标记为 [验证] 的任务只需运行验证并确认通过）：
    - **RED**：只写一个测试，在约定接缝上通过公共接口断言 spec 场景的行为。
      运行它，确认失败，且失败原因是「目标行为/接口尚未实现」：断言失败，或因引用尚未
      实现的公共接口导致的编译/类型错误，都是有效的 RED；测试自身的拼写、语法或
      环境配置错误不算，需先修正。
    - **GREEN**：写刚好让它通过的最少代码，不预支后续任务的功能。运行全量相关测试，全部通过。
    - **REFACTOR**：在全绿状态下清理本轮触及的代码（命名、重复、结构），每步后重跑测试。
    - 完成后才把该任务标为 `- [x]`。

    约束：
    - 一次只做一个切片；不要批量写测试。
    - 只 mock 系统边界（网络、时间、外部服务等），不 mock 内部协作者、不测私有方法。
    - 期望值来自 spec/业务事实，不得在断言中复算实现逻辑。
    - 需要新增接缝、接缝不合适、或需求/接口需要变化时，暂停并回报用户，
      必要时先更新 specs / design / interface 再继续。
    - 跨模块的大重构属于设计决策，不在循环中顺手完成。
